<script>
  var STATE = { data: null, days: [], idx: {}, curIso: null };
  var PHOTO_CACHE = {}; // sorgu -> url ('' = bulunamadı)

  var MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  var MONTHS_SHORT = ['OCA','ŞUB','MAR','NİS','MAY','HAZ','TEM','AĞU','EYL','EKİ','KAS','ARA'];

  document.addEventListener('DOMContentLoaded', function () {
    google.script.run.withSuccessHandler(onData).withFailureHandler(onError).getMenuData();

    document.getElementById('todayBtn').addEventListener('click', goToToday);
    document.getElementById('dateSelect').addEventListener('change', function () {
      if (this.value) showDay(this.value, true);
    });
    document.getElementById('search').addEventListener('input', function () { applySearch(this.value); });
  });

  function onError(err) {
    document.getElementById('menu').innerHTML =
      '<div class="error">Menü yüklenemedi.<br><small>' + escapeHtml(err && err.message ? err.message : err) +
      '</small><br><br>Lütfen CONFIG içindeki SPREADSHEET_ID / SHEET_NAME değerlerini kontrol edin.</div>';
  }

  function onData(data) {
    STATE.data = data;
    STATE.days = data.days || [];
    STATE.idx = {};
    STATE.days.forEach(function (d, i) { STATE.idx[d.iso] = i; });

    document.getElementById('pageTitle').textContent = data.title || 'Yemek Listesi';
    document.getElementById('genAt').textContent = 'Son güncelleme: ' + (data.generatedAt || '');

    if (!STATE.days.length) {
      document.getElementById('menu').innerHTML =
        '<div class="error">E-Tabloda tarih başlığı bulunamadı.<br><small>Başlıkların "1 Temmuz 2026 Çarşamba" biçiminde olduğundan emin olun.</small></div>';
      return;
    }

    fillDateSelect(STATE.days);
    showDay(pickDefault(), false);
  }

  function pickDefault() {
    var days = STATE.days, today = STATE.data.today;
    for (var i = 0; i < days.length; i++) if (days[i].iso === today) return days[i].iso;
    for (var j = 0; j < days.length; j++) if (days[j].iso >= today) return days[j].iso;
    return days[0].iso;
  }

  function fillDateSelect(days) {
    var sel = document.getElementById('dateSelect');
    sel.innerHTML = days.map(function (d) {
      return '<option value="' + d.iso + '">' + d.day + ' ' + MONTHS[d.month - 1] + ' · ' + d.weekday + '</option>';
    }).join('');
  }

  /* -------------------------- TEK GÜN GÖRÜNÜMÜ -------------------------- */

  function showDay(iso, scroll) {
    if (STATE.idx[iso] === undefined) return;
    STATE.curIso = iso;
    var d = STATE.days[STATE.idx[iso]];

    var sel = document.getElementById('dateSelect');
    if (sel.value !== iso) sel.value = iso;

    var i = STATE.idx[iso];
    var hasPrev = i > 0, hasNext = i < STATE.days.length - 1;
    var isToday = iso === STATE.data.today;

    var menu = document.getElementById('menu');
    menu.innerHTML =
      '<section class="day open">' +
        '<div class="day-head">' +
          '<span class="day-date"><span class="d">' + d.day + '</span><span class="m">' + (MONTHS_SHORT[d.month - 1] || '') + '</span></span>' +
          '<div class="day-title"><span class="wd">' + escapeHtml(d.weekday) +
            (isToday ? '<span class="today-tag">BUGÜN</span>' : '') +
            '</span><span class="sub">' + d.day + ' ' + MONTHS[d.month - 1] + ' · ' + d.dishCount + ' çeşit yemek</span></div>' +
          '<div class="daynav">' +
            '<button class="navbtn" id="prevDay" ' + (hasPrev ? '' : 'disabled') + ' aria-label="Önceki gün">‹</button>' +
            '<button class="navbtn" id="nextDay" ' + (hasNext ? '' : 'disabled') + ' aria-label="Sonraki gün">›</button>' +
          '</div>' +
        '</div>' +
        '<div class="dishes">' + (d.dishes.length ? d.dishes.map(dishHtml).join('') : '<div class="empty-day">Bu gün için menü girilmemiş.</div>') + '</div>' +
      '</section>';

    if (hasPrev) document.getElementById('prevDay').addEventListener('click', function () { showDay(STATE.days[i - 1].iso, true); });
    if (hasNext) document.getElementById('nextDay').addEventListener('click', function () { showDay(STATE.days[i + 1].iso, true); });

    loadPhotos(menu);

    if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goToToday() { showDay(pickDefault(), true); }

  /* -------------------------- YEMEK KARTI -------------------------- */

  function dishHtml(dish) {
    var g = gradientFor(dish.tag);
    return '<div class="dish" data-name="' + escapeHtml(trLower(dish.pretty)) + '"' +
             ' data-q="' + escapeHtml(dishQuery(dish.name)) + '"' +
             ' data-override="' + escapeHtml(dish.override || '') + '">' +
      '<div class="thumb" style="background:linear-gradient(135deg,' + g[0] + ',' + g[1] + ')">' +
        '<span class="emoji">' + escapeHtml(dish.emoji || '🍽️') + '</span>' +
        '<span class="cat">' + escapeHtml((dish.emoji || '') + ' ' + dish.category) + '</span>' +
      '</div>' +
      '<div class="name">' + escapeHtml(dish.pretty || dish.name) + '</div>' +
    '</div>';
  }

  function gradientFor(tag) {
    var m = {
      soup: ['#e0a35a', '#c9711f'], kebab: ['#c9502a', '#a13417'], rice: ['#e6c887', '#cba954'],
      pasta: ['#e8b96a', '#cf9a3d'], pastry: ['#e0a458', '#c47e2b'], dessert: ['#d98cae', '#bd5f88'],
      salad: ['#7cbf59', '#4f9b3a'], pickles: ['#8fb84f', '#6a9433'], vegetable: ['#8aa84a', '#5f8034'],
      ayran: ['#79b6d6', '#4f8fb8'], yogurt: ['#cfd6dd', '#a7b0ba'], hummus: ['#d9b56b', '#bd923f'],
      bread: ['#d7b483', '#b98f52']
    };
    return m[tag] || ['#c99a5a', '#a9793a'];
  }

  /* -------------------------- FOTOĞRAF (Wikipedia) -------------------------- */

  function loadPhotos(root) {
    Array.prototype.forEach.call(root.querySelectorAll('.dish'), function (el) {
      loadPhoto(el);
    });
  }

  function loadPhoto(dishEl) {
    if (dishEl.getAttribute('data-loaded')) return;
    dishEl.setAttribute('data-loaded', '1');

    var override = dishEl.getAttribute('data-override');
    if (override) { setPhoto(dishEl, override); return; }
    if (!window.fetch) return;

    var q = dishEl.getAttribute('data-q');
    if (!q) return;

    if (PHOTO_CACHE[q] !== undefined) {
      if (PHOTO_CACHE[q]) setPhoto(dishEl, PHOTO_CACHE[q]);
      return;
    }

    var api = 'https://tr.wikipedia.org/w/api.php?action=query&format=json&origin=*' +
      '&generator=search&gsrsearch=' + encodeURIComponent(q) + '&gsrlimit=1&gsrnamespace=0' +
      '&prop=pageimages&piprop=thumbnail&pithumbsize=400&redirects=1';

    fetch(api).then(function (r) { return r.json(); }).then(function (d) {
      var src = '';
      var pages = d && d.query && d.query.pages;
      if (pages) { for (var k in pages) { var p = pages[k]; if (p.thumbnail && p.thumbnail.source) { src = p.thumbnail.source; break; } } }
      PHOTO_CACHE[q] = src;
      if (src) setPhoto(dishEl, src);
    }).catch(function () { PHOTO_CACHE[q] = ''; });
  }

  function setPhoto(dishEl, src) {
    var t = dishEl.querySelector('.thumb');
    if (!t || t.classList.contains('has-photo')) return;
    var img = new Image();
    img.referrerPolicy = 'no-referrer';
    img.onload = function () {
      img.className = 'photo';
      t.insertBefore(img, t.firstChild);
      t.classList.add('has-photo');
    };
    img.src = src;
  }

  /**
   * Yemek adını iyi bir Wikipedia arama sorgusuna çevirir.
   * Önce bilinen yemekler için elle eşleme, sonra sıfat ayıklama.
   */
  function dishQuery(name) {
    var n = trLower(name);
    var map = [
      ['ezogelin', 'ezogelin çorbası'], ['mercimek', 'mercimek çorbası'],
      ['düğün çorba', 'düğün çorbası'], ['tavuksuyu', 'tavuk suyu çorbası'], ['tavuk suyu', 'tavuk suyu çorbası'],
      ['yoğurt çorba', 'yayla çorbası'], ['yayla', 'yayla çorbası'], ['domates çorba', 'domates çorbası'],
      ['şehriye çorba', 'şehriye çorbası'], ['sebze çorba', 'sebze çorbası'], ['ezo', 'ezogelin çorbası'],
      ['çiğ köfte', 'çiğ köfte'], ['iskender', 'iskender kebap'], ['musakka', 'musakka'],
      ['karnıyarık', 'karnıyarık'], ['biftek', 'biftek'], ['schnitzel', 'şnitzel'], ['şinitzel', 'şnitzel'],
      ['döner', 'döner kebap'], ['kavurma', 'kavurma'], ['saç', 'saç kavurma'],
      ['baget', 'tavuk baget'], ['piliç', 'ızgara tavuk'], ['tavuk', 'tavuk yemeği'],
      ['köfte', 'köfte'], ['bulgur', 'bulgur pilavı'], ['pilav', 'pilav'],
      ['mantı', 'mantı'], ['makarna', 'makarna'], ['erişte', 'erişte'],
      ['börek', 'su böreği'], ['poğaça', 'poğaça'], ['gözleme', 'gözleme'], ['pide', 'pide'],
      ['ayran', 'ayran'], ['cacık', 'cacık'], ['yoğurt', 'yoğurt'], ['humus', 'humus'], ['haydari', 'haydari'],
      ['dondurma', 'dondurma'], ['baklava', 'baklava'], ['sütlaç', 'sütlaç'], ['aşure', 'aşure'],
      ['kadayıf', 'kadayıf'], ['revani', 'revani'], ['muhallebi', 'muhallebi'], ['kazandibi', 'kazandibi'],
      ['irmik helva', 'irmik helvası'], ['helva', 'helva'], ['kemalpaşa', 'kemalpaşa tatlısı'],
      ['kuru fasulye', 'kuru fasulye'], ['taze fasulye', 'taze fasulye'], ['barbunya', 'barbunya pilaki'],
      ['fasulye', 'kuru fasulye'], ['nohut', 'nohut yemeği'], ['bamya', 'bamya yemeği'],
      ['türlü', 'türlü'], ['semizotu', 'semizotu yemeği'], ['ıspanak', 'ıspanak yemeği'],
      ['pırasa', 'pırasa yemeği'], ['mücver', 'mücver'], ['dolma', 'dolma'], ['sarma', 'yaprak sarma'],
      ['kısır', 'kısır'], ['söğüş', 'söğüş'], ['salata', 'salata'], ['turşu', 'turşu'],
      ['herse', 'keşkek'], ['keşkek', 'keşkek'], ['çorba', 'çorba']
    ];
    for (var i = 0; i < map.length; i++) { if (n.indexOf(map[i][0]) !== -1) return map[i][1]; }

    var strip = ['karışık', 'soslu', 'sade', 'terbiyeli', 'ferah', 'soğuk', 'sıcak', 'fırın', 'fırında',
      'kasap', 'ev', 'közlenmiş', 'zeytinyağlı', 'etli', 'etsiz', 'taze', 'mevsim', 'çıtır', 'özel',
      'baharatlı', 'light', 'diyet', 'sebzeli', 'peynirli', 'mantarlı', 'mantar', 'sütlü', 'yoğurtlu',
      'ekşili', 'arpa', 'şehriyeli', 'mısırlı', 'biberiye', 'göbek', 'yeşil', 'çoban'];
    var words = n.replace(/&/g, ' ').replace(/\./g, ' ').split(/\s+/).filter(function (w) {
      return w && strip.indexOf(w) === -1;
    });
    return words.join(' ').trim() || n;
  }

  /* -------------------------- ARAMA -------------------------- */

  function applySearch(q) {
    q = trLower((q || '').trim());
    if (!q) { showDay(STATE.curIso || pickDefault(), false); return; }

    var menu = document.getElementById('menu');
    var blocks = [];
    STATE.days.forEach(function (d) {
      var matches = d.dishes.filter(function (dish) { return trLower(dish.pretty).indexOf(q) !== -1; });
      if (!matches.length) return;
      blocks.push(
        '<section class="day open">' +
          '<div class="day-head">' +
            '<span class="day-date"><span class="d">' + d.day + '</span><span class="m">' + (MONTHS_SHORT[d.month - 1] || '') + '</span></span>' +
            '<div class="day-title"><span class="wd">' + escapeHtml(d.weekday) + '</span>' +
            '<span class="sub">' + d.day + ' ' + MONTHS[d.month - 1] + '</span></div>' +
          '</div>' +
          '<div class="dishes">' + matches.map(dishHtml).join('') + '</div>' +
        '</section>'
      );
    });

    menu.innerHTML = blocks.length
      ? '<div class="search-head">“' + escapeHtml(q) + '” için ' + blocks.length + ' gün bulundu</div>' + blocks.join('')
      : '<div class="noresult">“' + escapeHtml(q) + '” için sonuç bulunamadı.</div>';

    if (blocks.length) loadPhotos(menu);
  }

  /* -------------------------- YARDIMCILAR -------------------------- */

  function trLower(s) {
    return String(s == null ? '' : s).replace(/İ/g, 'i').replace(/I/g, 'ı').toLowerCase();
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
</script>
