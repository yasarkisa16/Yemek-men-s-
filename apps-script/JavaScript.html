<script>
  var STATE = { data: null, days: [], idx: {}, curIso: null };

  var MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  var MONTHS_SHORT = ['OCA','ŞUB','MAR','NİS','MAY','HAZ','TEM','AĞU','EYL','EKİ','KAS','ARA'];

  document.addEventListener('DOMContentLoaded', function () {
    google.script.run.withSuccessHandler(onData).withFailureHandler(onError).getMenuData();

    document.getElementById('todayBtn').addEventListener('click', goToToday);
    document.getElementById('dateSelect').addEventListener('change', function () {
      if (this.value) showDay(this.value, true);
    });
    document.getElementById('search').addEventListener('input', function () { applySearch(this.value); });
    initDietitian();
  });

  function onError(err) {
    document.getElementById('menu').innerHTML =
      '<div class="error">Menü yüklenemedi.<br><small>' + escapeHtml(err && err.message ? err.message : err) +
      '</small><br><br>Lütfen CONFIG içindeki SPREADSHEET_ID / SHEET_NAME değerlerini kontrol edin.</div>';
  }

  function onData(data) {
    STATE.data = data;
    STATE.days = data.days || [];
    STATE.idx = {};
    STATE.days.forEach(function (d, i) { STATE.idx[d.iso] = i; });

    document.getElementById('pageTitle').textContent = data.title || 'Yemek Listesi';
    document.getElementById('genAt').textContent = 'Son güncelleme: ' + (data.generatedAt || '');

    if (!STATE.days.length) {
      document.getElementById('menu').innerHTML =
        '<div class="error">E-Tabloda tarih başlığı bulunamadı.<br><small>Başlıkların "1 Temmuz 2026 Çarşamba" biçiminde olduğundan emin olun.</small></div>';
      return;
    }

    fillDateSelect(STATE.days);
    showDay(pickDefault(), false);
  }

  function pickDefault() {
    var days = STATE.days, today = STATE.data.today;
    for (var i = 0; i < days.length; i++) if (days[i].iso === today) return days[i].iso;
    for (var j = 0; j < days.length; j++) if (days[j].iso >= today) return days[j].iso;
    return days[0].iso;
  }

  function fillDateSelect(days) {
    var sel = document.getElementById('dateSelect');
    sel.innerHTML = days.map(function (d) {
      return '<option value="' + d.iso + '">' + d.day + ' ' + MONTHS[d.month - 1] + ' · ' + d.weekday + '</option>';
    }).join('');
  }

  /* -------------------------- TEK GÜN GÖRÜNÜMÜ -------------------------- */

  function showDay(iso, scroll) {
    if (STATE.idx[iso] === undefined) return;
    STATE.curIso = iso;
    var i = STATE.idx[iso], d = STATE.days[i];

    var sel = document.getElementById('dateSelect');
    if (sel.value !== iso) sel.value = iso;

    var hasPrev = i > 0, hasNext = i < STATE.days.length - 1;
    var isToday = iso === STATE.data.today;

    document.getElementById('menu').innerHTML =
      '<section class="day">' +
        '<div class="day-head">' +
          '<span class="day-date"><span class="d">' + d.day + '</span><span class="m">' + (MONTHS_SHORT[d.month - 1] || '') + '</span></span>' +
          '<div class="day-title"><span class="wd">' + escapeHtml(d.weekday) +
            (isToday ? '<span class="today-tag">BUGÜN</span>' : '') +
            '</span><span class="sub">' + d.day + ' ' + MONTHS[d.month - 1] + ' · ' + d.dishCount + ' çeşit yemek</span></div>' +
          '<div class="daynav">' +
            '<button class="navbtn" id="prevDay" ' + (hasPrev ? '' : 'disabled') + ' aria-label="Önceki gün">‹</button>' +
            '<button class="navbtn" id="nextDay" ' + (hasNext ? '' : 'disabled') + ' aria-label="Sonraki gün">›</button>' +
          '</div>' +
        '</div>' +
        '<div class="dishes">' +
          (d.dishes.length ? d.dishes.map(function (x, di) { return dishHtml(x, di); }).join('') : '<div class="empty-day">Bu gün için menü girilmemiş.</div>') +
        '</div>' +
        '<div class="plate-bar empty" id="plateBar"></div>' +
      '</section>';

    if (hasPrev) document.getElementById('prevDay').addEventListener('click', function () { showDay(STATE.days[i - 1].iso, true); });
    if (hasNext) document.getElementById('nextDay').addEventListener('click', function () { showDay(STATE.days[i + 1].iso, true); });

    var section = document.querySelector('#menu .day');
    Array.prototype.forEach.call(section.querySelectorAll('.dish'), function (row) {
      row.addEventListener('click', function () { toggleDishRow(row); });
      row.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleDishRow(row); } });
    });
    recomputePlate();

    if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goToToday() { showDay(pickDefault(), true); }

  /* -------------------------- YEMEK SATIRI -------------------------- */

  // plain=true -> arama sonuçları için (tıklanamaz, tik yok)
  function dishHtml(dish, i, plain) {
    var g = gradientFor(dish.tag);
    var k = (dish.kcal != null ? dish.kcal : (CAT_KCAL[dish.tag] || 200));
    var m = macrosOf(k, dish.tag);
    var tick = plain ? '' : '<span class="tick" aria-hidden="true"></span>';
    var attrs = plain ? '' : (' data-i="' + i + '" data-kcal="' + k + '" data-p="' + m.p + '" data-c="' + m.c + '" data-f="' + m.f + '" role="button" tabindex="0" aria-pressed="false"');
    return '<div class="dish' + (plain ? ' plain' : '') + '"' + attrs + '>' +
      tick +
      '<span class="icon" style="background:linear-gradient(135deg,' + g[0] + ',' + g[1] + ')">' + escapeHtml(dish.emoji || '🍽️') + '</span>' +
      '<div class="info">' +
        '<span class="dname">' + escapeHtml(dish.pretty || dish.name) + '</span>' +
        '<span class="dcat">' + escapeHtml(dish.category) + '</span>' +
      '</div>' +
      '<span class="kcal" title="Porsiyon başına yaklaşık kalori">≈ ' + k + '<small>kcal</small></span>' +
    '</div>';
  }

  /* Bir yemeği tabağa ekle/çıkar */
  function toggleDishRow(row) {
    var on = row.classList.toggle('selected');
    row.setAttribute('aria-pressed', on ? 'true' : 'false');
    recomputePlate();
  }

  /* Diyetisyenin önerdiği yemekleri menüde işaretle, gerisini silikleştir */
  function applyRecommendation(idxList) {
    var section = document.querySelector('#menu .day');
    if (!section) return;
    Array.prototype.forEach.call(section.querySelectorAll('.dish'), function (row) {
      var on = idxList.indexOf(+row.getAttribute('data-i')) !== -1;
      row.classList.toggle('selected', on);
      row.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    recomputePlate();
  }

  /* Seçili yemeklerin toplamını alt çubukta göster */
  function recomputePlate() {
    var section = document.querySelector('#menu .day');
    if (!section) return;
    var wrap = section.querySelector('.dishes');
    var bar = section.querySelector('#plateBar');
    if (!wrap || !bar) return;
    var sel = section.querySelectorAll('.dish.selected');
    wrap.classList.toggle('has-selection', sel.length > 0);

    var tot = { n: 0, kcal: 0, p: 0, c: 0, f: 0 };
    Array.prototype.forEach.call(sel, function (r) {
      tot.n++; tot.kcal += +r.getAttribute('data-kcal');
      tot.p += +r.getAttribute('data-p'); tot.c += +r.getAttribute('data-c'); tot.f += +r.getAttribute('data-f');
    });

    if (tot.n === 0) {
      bar.className = 'plate-bar empty';
      bar.innerHTML = '<span class="pb-hint">Bir yemeğe dokunarak tabağını oluştur ya da <b>🥗 Diyetisyen</b>\'e sor.</span>';
    } else {
      bar.className = 'plate-bar';
      bar.innerHTML =
        '<div class="pb-left"><span class="pb-n">' + tot.n + ' yemek seçildi</span>' +
        '<span class="pb-macros">Protein ' + tot.p + ' g · Karb. ' + tot.c + ' g · Yağ ' + tot.f + ' g</span></div>' +
        '<div class="pb-kcal">≈ ' + tot.kcal + '<small>kcal</small></div>';
    }
  }

  function gradientFor(tag) {
    var m = {
      soup: ['#e0a35a', '#c9711f'], kebab: ['#c9502a', '#a13417'], rice: ['#e6c887', '#cba954'],
      pasta: ['#e8b96a', '#cf9a3d'], pastry: ['#e0a458', '#c47e2b'], dessert: ['#d98cae', '#bd5f88'],
      salad: ['#7cbf59', '#4f9b3a'], pickles: ['#8fb84f', '#6a9433'], vegetable: ['#8aa84a', '#5f8034'],
      ayran: ['#79b6d6', '#4f8fb8'], yogurt: ['#cfd6dd', '#a7b0ba'], hummus: ['#d9b56b', '#bd923f'],
      bread: ['#d7b483', '#b98f52']
    };
    return m[tag] || ['#c99a5a', '#a9793a'];
  }

  /* -------------------------- ARAMA -------------------------- */

  function applySearch(q) {
    q = trLower((q || '').trim());
    if (!q) { showDay(STATE.curIso || pickDefault(), false); return; }

    var blocks = [];
    STATE.days.forEach(function (d) {
      var matches = d.dishes.filter(function (dish) { return trLower(dish.pretty).indexOf(q) !== -1; });
      if (!matches.length) return;
      blocks.push(
        '<section class="day">' +
          '<div class="day-head">' +
            '<span class="day-date"><span class="d">' + d.day + '</span><span class="m">' + (MONTHS_SHORT[d.month - 1] || '') + '</span></span>' +
            '<div class="day-title"><span class="wd">' + escapeHtml(d.weekday) + '</span>' +
            '<span class="sub">' + d.day + ' ' + MONTHS[d.month - 1] + '</span></div>' +
          '</div>' +
          '<div class="dishes">' + matches.map(function (x) { return dishHtml(x, 0, true); }).join('') + '</div>' +
        '</section>'
      );
    });

    document.getElementById('menu').innerHTML = blocks.length
      ? '<div class="search-head">“' + escapeHtml(q) + '” için ' + blocks.length + ' gün bulundu</div>' + blocks.join('')
      : '<div class="noresult">“' + escapeHtml(q) + '” için sonuç bulunamadı.</div>';
  }

  /* ===================== DİYETİSYEN ASİSTAN ===================== */

  var ANS = { health: [], goal: null };
  var GOAL_LABEL = { lose: 'Zayıflama', gain: 'Kilo alma', muscle: 'Kas yapma', maintain: 'Kilo koruma' };
  var HEALTH_LABEL = { yok: 'Sağlık sorunum yok', seker: 'Şeker (diyabet)', kolesterol: 'Kolesterol', tansiyon: 'Tansiyon' };
  var CAT_KCAL = { soup:120, kebab:360, rice:270, pasta:320, pastry:300, dessert:340, salad:70, pickles:20, vegetable:170, ayran:70, yogurt:90, hummus:170, bread:90, 'turkish-food':220 };
  // Kaloriye göre makro oranları [protein%, karbonhidrat%, yağ%]
  var MACRO_RATIO = { soup:[20,55,25], kebab:[34,10,56], rice:[8,78,14], pasta:[13,70,17], pastry:[12,42,46], dessert:[6,62,32], salad:[14,48,38], pickles:[15,75,10], vegetable:[14,54,32], ayran:[22,34,44], yogurt:[24,30,46], hummus:[12,40,48], bread:[13,80,7], 'turkish-food':[15,50,35] };
  function macrosOf(kcal, tag) {
    var r = MACRO_RATIO[tag] || MACRO_RATIO['turkish-food'];
    return { p: Math.round(kcal * r[0] / 100 / 4), c: Math.round(kcal * r[1] / 100 / 4), f: Math.round(kcal * r[2] / 100 / 9) };
  }

  function initDietitian() {
    var fab = document.getElementById('dietFab');
    if (!fab) return;
    fab.addEventListener('click', openDiet);
    document.getElementById('dietClose').addEventListener('click', closeDiet);
    document.getElementById('dietOverlay').addEventListener('click', closeDiet);
  }
  function openDiet() {
    document.getElementById('dietOverlay').hidden = false;
    document.getElementById('dietPanel').hidden = false;
    document.body.style.overflow = 'hidden';
    dietStart();
  }
  function closeDiet() {
    document.getElementById('dietOverlay').hidden = true;
    document.getElementById('dietPanel').hidden = true;
    document.body.style.overflow = '';
  }

  function dBody() { return document.getElementById('dietBody'); }
  function dActions() { return document.getElementById('dietActions'); }
  function scrollChat() { var b = dBody(); b.scrollTop = b.scrollHeight; }
  function clearActions() { dActions().innerHTML = ''; }
  function botSay(text) { var m = document.createElement('div'); m.className = 'msg bot'; m.textContent = text; dBody().appendChild(m); scrollChat(); }
  function botSayHtml(html) { var m = document.createElement('div'); m.className = 'msg bot'; m.innerHTML = html; dBody().appendChild(m); scrollChat(); }
  function userSay(text) { var m = document.createElement('div'); m.className = 'msg user'; m.textContent = text; dBody().appendChild(m); scrollChat(); }
  function resetChat() { dBody().innerHTML = ''; clearActions(); ANS = { health: [], goal: null }; }

  function options(list, onPick) {
    clearActions();
    list.forEach(function (o) {
      var b = document.createElement('button');
      b.className = 'opt'; b.type = 'button'; b.textContent = o.t;
      b.addEventListener('click', function () { clearActions(); onPick(o.v, o.t); });
      dActions().appendChild(b);
    });
  }
  function multiOptions(list, onDone) {
    clearActions();
    var picked = [];
    list.forEach(function (o) {
      var b = document.createElement('button');
      b.className = 'opt toggle'; b.type = 'button'; b.textContent = o.t;
      b.addEventListener('click', function () {
        if (o.v === 'yok') {
          picked = ['yok'];
          Array.prototype.forEach.call(dActions().querySelectorAll('.opt.toggle'), function (x) { x.classList.remove('sel'); });
          b.classList.add('sel');
          return;
        }
        var yokBtn = dActions().querySelector('.opt.toggle');
        var i = picked.indexOf(o.v);
        if (i === -1) {
          picked.push(o.v); b.classList.add('sel');
          var yi = picked.indexOf('yok'); if (yi !== -1) { picked.splice(yi, 1); if (yokBtn) yokBtn.classList.remove('sel'); }
        } else { picked.splice(i, 1); b.classList.remove('sel'); }
      });
      dActions().appendChild(b);
    });
    var cont = document.createElement('button');
    cont.className = 'opt cont'; cont.type = 'button'; cont.textContent = 'Devam ►';
    cont.addEventListener('click', function () { clearActions(); onDone(picked.length ? picked : ['yok']); });
    dActions().appendChild(cont);
  }

  function dietStart() {
    if (!STATE.days || !STATE.days.length) { resetChat(); botSay('Menü henüz yükleniyor 🙂 Birazdan tekrar deneyin.'); return; }
    resetChat();
    botSay('Merhaba! 👋 Ben menü asistanınızım. Bugünkü menüden hedefinize ve sağlığınıza en uygun seçimi birlikte yapmama yardımcı olayım mı?');
    options([{ t: 'Evet, yardım et 👍', v: 'yes' }, { t: 'Şimdilik hayır', v: 'no' }], function (v) {
      userSay(v === 'yes' ? 'Evet, yardım et' : 'Şimdilik hayır');
      if (v === 'no') { botSay('Ne zaman isterseniz buradayım. Afiyet olsun! 🍽️'); clearActions(); return; }
      askHealth();
    });
  }
  function askHealth() {
    botSay('Öncelikle: herhangi bir sağlık durumunuz var mı? Birden fazla seçebilirsiniz.');
    multiOptions([
      { t: HEALTH_LABEL.yok, v: 'yok' }, { t: HEALTH_LABEL.seker, v: 'seker' },
      { t: HEALTH_LABEL.kolesterol, v: 'kolesterol' }, { t: HEALTH_LABEL.tansiyon, v: 'tansiyon' }
    ], function (sel) {
      ANS.health = sel;
      userSay(sel.map(function (s) { return HEALTH_LABEL[s]; }).join(', '));
      askGoal();
    });
  }
  function askGoal() {
    botSay('Peki hedefiniz ne? 🎯');
    options([
      { t: 'Zayıflamak / kilo vermek', v: 'lose' }, { t: 'Kilo almak', v: 'gain' },
      { t: 'Kas yapmak', v: 'muscle' }, { t: 'Kiloyu korumak', v: 'maintain' }
    ], function (v, t) { ANS.goal = v; userSay(t); recommend(); });
  }

  function pickBy(arr, fn) { return arr.slice().sort(function (a, b) { return fn(b) - fn(a); })[0]; }

  function scoreMain(x, goal, health) {
    var s = 0;
    if (goal === 'muscle') s += x.p * 3 - x.f * 0.4;
    else if (goal === 'lose') s += x.p * 1.5 - x.kcal * 0.05 - x.f * 0.8;
    else if (goal === 'gain') s += x.kcal * 0.05 + x.p;
    else s += x.p - x.f * 0.3;
    if (health.indexOf('kolesterol') !== -1) {
      if (/kavurma|kızart|kizart|döner|doner|sucuk|pastırma|kaburga|kuyruk|kızarmış/.test(x.raw)) s -= 25;
      if (/tavuk|balık|balik|ızgara|izgara|haşla|hasla|köfte|kofte|piliç|pilic/.test(x.raw)) s += 6;
    }
    return s;
  }
  function pickStarch(st, goal, health) {
    return st.slice().sort(function (a, b) {
      var sa = 0, sb = 0;
      if (health.indexOf('seker') !== -1) { sa += /bulgur/.test(a.raw) ? 12 : 0; sb += /bulgur/.test(b.raw) ? 12 : 0; }
      if (goal === 'lose') { sa -= a.kcal * 0.05; sb -= b.kcal * 0.05; }
      if (goal === 'gain') { sa += a.kcal * 0.05; sb += b.kcal * 0.05; }
      return sb - sa;
    })[0];
  }

  function recommend() {
    var d = STATE.days[STATE.idx[STATE.curIso]] || STATE.days[STATE.idx[pickDefault()]];
    var goal = ANS.goal, health = ANS.health;

    var list = d.dishes.map(function (x, oi) {
      var k = (x.kcal != null ? x.kcal : (CAT_KCAL[x.tag] || 200));
      var m = macrosOf(k, x.tag);
      return { oi: oi, name: x.pretty, emoji: x.emoji, tag: x.tag, kcal: k, p: m.p, c: m.c, f: m.f, raw: trLower(x.name) };
    });
    function byTags(t) { return list.filter(function (x) { return t.indexOf(x.tag) !== -1; }); }
    var soups = byTags(['soup']), mains = byTags(['kebab']), starch = byTags(['rice', 'pasta']),
        vegs = byTags(['vegetable']), salads = byTags(['salad']), mezes = byTags(['hummus']),
        pickles = byTags(['pickles']), drinks = byTags(['ayran', 'yogurt']),
        desserts = byTags(['dessert']), pastry = byTags(['pastry']);

    var plate = [], notes = [];
    function add(x) { if (x && plate.indexOf(x) === -1) plate.push(x); }

    if (soups.length) add(pickBy(soups, function (x) { return -x.kcal; }));

    if (mains.length) {
      var main = mains.slice().sort(function (a, b) { return scoreMain(b, goal, health) - scoreMain(a, goal, health); })[0];
      add(main);
      if (mains.length > 1) notes.push('Ana yemeklerden (et) firma kuralı gereği <b>1 tanesini</b> seçtim: <b>' + escapeHtml(main.name) + '</b>.');
    } else if (vegs.length) {
      add(vegs.slice().sort(function (a, b) { return goal === 'lose' ? a.kcal - b.kcal : b.p - a.p; })[0]);
    }

    if (mains.length && vegs.length && goal !== 'gain') {
      add(vegs.slice().sort(function (a, b) { return a.kcal - b.kcal; })[0]); // yanına hafif sebze
    }

    if (starch.length) {
      if (goal === 'lose') {
        notes.push('Zayıflama için pilav/makarnayı bu öğün <b>atlayın</b> ya da yarım porsiyon alın (yüksek karbonhidrat).');
      } else {
        var st = pickStarch(starch, goal, health);
        add(st);
        if (starch.length > 1) notes.push('Pilav/makarnadan firma kuralı gereği <b>1 tanesini</b> seçtim: <b>' + escapeHtml(st.name) + '</b>.');
      }
    }

    if (salads.length) { add(pickBy(salads, function (x) { return -x.kcal; })); notes.push('Bol salata: tokluk ve lif için ideal, kaloriyi az artırır.'); }
    else if (mezes.length && goal !== 'lose') { add(mezes[0]); }

    if (drinks.length) add(pickBy(drinks, function (x) { return x.p; }));

    if (desserts.length) {
      if (health.indexOf('seker') !== -1) notes.push('🚫 Şeker (diyabet): tatlıyı atlayın; isterseniz taze meyve veya sade yoğurt tercih edin.');
      else if (goal === 'gain') add(pickBy(desserts, function (x) { return x.kcal; }));
      else if (goal === 'muscle') notes.push('Tatlı şart değil; protein hedefi için ayran/yoğurt daha faydalı.');
      else notes.push('Tatlıyı atlarsanız kaloriyi dengede tutarsınız; çok isterseniz küçük porsiyon.');
    }

    if (pastry.length && goal !== 'gain') notes.push('Börek/hamur işi (yağ + karbonhidrat yüksek) — sınırlı tutun.');
    if (health.indexOf('kolesterol') !== -1) notes.push('❤️ Kolesterol: kızartma/kavurma yerine ızgara-haşlama; kırmızı et yerine tavuk/balık; börek ve tatlıyı azaltın.');
    if (health.indexOf('tansiyon') !== -1) { notes.push('🩺 Tansiyon: turşu ve aşırı tuzdan kaçının, sofrada ekstra tuz eklemeyin.'); if (pickles.length) notes.push('Menüdeki turşuyu bu nedenle önermedim.'); }
    if (goal === 'muscle') notes.push('💪 Kas için proteini öne çıkardım; gün içinde bol su ve yeterli protein (yoğurt/ayran/et) alın.');
    if (goal === 'lose') notes.push('🔥 Zayıflama: önce çorba + salata, sonra protein; şekerli içecek yerine su/ayran.');
    if (goal === 'gain') notes.push('⚖️ Kilo alma: porsiyonları biraz büyütün, araya sağlıklı atıştırmalık ekleyin.');

    var tot = plate.reduce(function (a, x) { a.kcal += x.kcal; a.p += x.p; a.c += x.c; a.f += x.f; return a; }, { kcal: 0, p: 0, c: 0, f: 0 });

    applyRecommendation(plate.map(function (x) { return x.oi; }));

    var conds = health.length && health[0] !== 'yok' ? (' · ' + health.map(function (s) { return HEALTH_LABEL[s]; }).join(', ')) : '';
    botSayHtml('<b>' + d.day + ' ' + MONTHS[d.month - 1] + '</b> menüsünden <b>' + GOAL_LABEL[goal] + '</b>' + conds + ' hedefine göre <b>' + plate.length + ' yemek</b> seçtim ve menüde işaretledim. ✅');
    botSayHtml('<div class="rec-total">Seçilen toplam ≈ ' + tot.kcal + ' kcal · Protein ' + tot.p + ' g · Karbonhidrat ' + tot.c + ' g · Yağ ' + tot.f + ' g</div>');
    if (notes.length) botSayHtml('<div class="rec-notes"><div class="rn-title">💡 Neden bu seçim?</div><ul>' + notes.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul></div>');
    botSay('İstersen menüde başka bir yemeğe dokunarak tabağına ekleyip çıkarabilirsin; alttaki toplam otomatik güncellenir. Not: değerler yaklaşıktır, tıbbi tavsiye değildir. 🙏');

    options([{ t: '✓ Menüde göster', v: 'close' }, { t: '🔄 Baştan sor', v: 'again' }], function (v) {
      if (v === 'again') dietStart();
      else { closeDiet(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });
  }

  /* -------------------------- YARDIMCILAR -------------------------- */

  function trLower(s) {
    return String(s == null ? '' : s).replace(/İ/g, 'i').replace(/I/g, 'ı').toLowerCase();
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
</script>
