<style>
  /* ===== VALEO marka renkleri =====
     Yeşil #82E600 · Koyu (Mirage) #1D2433 · Beyaz #FFFFFF */
  :root {
    --bg: #f3f6f1;         /* açık nötr, hafif yeşil eğilimli */
    --card: #ffffff;
    --ink: #1d2433;        /* Valeo Mirage (metin) */
    --muted: #6c7482;
    --brand: #82e600;      /* Valeo yeşili */
    --brand-600: #5fae00;  /* beyaz üstünde okunur koyu yeşil (ikon/çizgi) */
    --dark: #1d2433;
    --dark-2: #2a3346;
    --line: #e4e9df;
    --shadow: 0 10px 34px rgba(29, 36, 51, 0.12);
    --radius: 16px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app { max-width: 1040px; margin: 0 auto; padding: 0 16px 60px; }

  /* -------------------------- HERO / BAŞLIK -------------------------- */
  .hero {
    position: relative;
    background: linear-gradient(135deg, #1d2433 0%, #2a3346 55%, #1d2433 100%);
    color: #fff;
    border-radius: 0 0 28px 28px;
    padding: 34px 22px 30px;
    margin: 0 -16px 26px;
    box-shadow: var(--shadow);
    text-align: center;
    overflow: hidden;
  }
  /* Valeo yeşili ince üst şerit */
  .hero::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: var(--brand);
  }
  .hero-inner { max-width: 720px; margin: 0 auto; position: relative; }
  .badge {
    display: inline-block;
    background: var(--brand);
    color: var(--dark);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .4px;
    margin-bottom: 14px;
  }
  .hero h1 {
    margin: 4px 0 6px;
    font-size: clamp(26px, 5vw, 40px);
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  /* Başlık altında yeşil vurgu çizgisi */
  .hero h1::after {
    content: "";
    display: block;
    width: 64px; height: 4px;
    background: var(--brand);
    border-radius: 999px;
    margin: 10px auto 0;
  }
  .hero .subtitle { margin: 6px 0 20px; opacity: .85; font-size: 15px; }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .controls label { font-size: 14px; font-weight: 600; opacity: .95; }
  select#dateSelect {
    appearance: none;
    -webkit-appearance: none;
    background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%231d2433' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 12px center;
    color: var(--ink);
    border: none;
    border-radius: 12px;
    padding: 11px 38px 11px 14px;
    font-size: 15px;
    font-weight: 600;
    min-width: 240px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  button#todayBtn {
    background: var(--brand);
    color: var(--dark);
    border: none;
    border-radius: 12px;
    padding: 11px 18px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.2);
    transition: transform .08s ease, filter .12s ease;
  }
  button#todayBtn:hover { filter: brightness(1.05); }
  button#todayBtn:active { transform: scale(.96); }

  input#search {
    width: 100%;
    max-width: 420px;
    border: none;
    border-radius: 12px;
    padding: 11px 16px;
    font-size: 15px;
    box-shadow: 0 4px 14px rgba(0,0,0,.14);
    outline: none;
    color: var(--ink);
  }
  input#search:focus-visible, select#dateSelect:focus-visible, button#todayBtn:focus-visible {
    outline: 3px solid var(--brand);
    outline-offset: 2px;
  }

  /* -------------------------- GÜN KARTI -------------------------- */
  .menu { display: flex; flex-direction: column; gap: 14px; }

  .search-head {
    font-size: 14px; font-weight: 700; color: var(--muted);
    padding: 2px 4px 2px;
  }

  .day {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .day-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
  }
  .day-date {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 58px;
    background: linear-gradient(135deg, #82e600, #6cc400);
    color: var(--dark);
    border-radius: 12px;
    padding: 8px 6px;
    line-height: 1.1;
  }
  .day-date .d { font-size: 22px; font-weight: 800; }
  .day-date .m { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; opacity: .85; }
  .day-title { flex: 1; display: flex; flex-direction: column; }
  .day-title .wd { font-size: 18px; font-weight: 800; color: var(--ink); }
  .day-title .sub { font-size: 13px; color: var(--muted); }
  .today-tag {
    background: var(--brand);
    color: var(--dark);
    font-size: 11px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
    margin-left: 8px;
  }

  .daynav { display: flex; gap: 8px; flex: none; }
  .navbtn {
    width: 40px; height: 40px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--brand-600);
    border-radius: 11px;
    font-size: 22px; font-weight: 800; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s ease, transform .08s ease;
  }
  .navbtn:hover:not([disabled]) { background: var(--brand); color: var(--dark); border-color: var(--brand); }
  .navbtn:active:not([disabled]) { transform: scale(.94); }
  .navbtn[disabled] { opacity: .35; cursor: not-allowed; }
  .navbtn:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

  .dishes {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px 18px 20px;
  }
  .dish {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    transition: transform .1s ease, box-shadow .1s ease, border-color .1s ease;
  }
  .dish:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--brand) 35%, var(--line)); }
  .dish .icon {
    width: 52px; height: 52px; flex: none;
    border-radius: 13px;
    display: grid; place-items: center;
    font-size: 27px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.28), 0 2px 6px rgba(29,36,51,.12);
  }
  .dish .info { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .dish .dname { font-size: 15px; font-weight: 700; color: var(--ink); }
  .dish .dcat { font-size: 12px; color: var(--muted); }
  .dish .kcal {
    flex: none;
    display: inline-flex; align-items: baseline; gap: 3px;
    font-size: 15px; font-weight: 800;
    color: var(--brand-600);
    background: color-mix(in srgb, var(--brand) 15%, var(--card));
    border: 1px solid color-mix(in srgb, var(--brand) 35%, var(--line));
    padding: 6px 12px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .dish .kcal small { font-size: 10px; font-weight: 700; color: var(--muted); }

  .empty-day { padding: 8px 4px 6px; color: var(--muted); font-size: 14px; }

  /* -------------------------- DURUM MESAJLARI -------------------------- */
  .loading, .error, .noresult {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 15px;
  }
  .error { color: #b23f11; }
  .spinner {
    width: 34px; height: 34px;
    border: 4px solid var(--line);
    border-top-color: var(--brand);
    border-radius: 50%;
    margin: 0 auto 14px;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .foot {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 30px;
  }

  @media (max-width: 480px) {
    .day-head { padding: 14px 14px; gap: 10px; }
    .dishes { padding: 14px; }
    .dish .icon { width: 46px; height: 46px; font-size: 24px; }
    .dish .kcal { font-size: 14px; padding: 5px 10px; }
    select#dateSelect { min-width: 180px; }
  }

  /* -------------------------- DİYETİSYEN ASİSTAN -------------------------- */
  .diet-fab {
    position: fixed; right: 18px; bottom: 18px; z-index: 50;
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, #82e600, #6cc400);
    color: var(--dark); border: none; border-radius: 999px;
    padding: 13px 20px; font-size: 15px; font-weight: 800; font-family: inherit;
    cursor: pointer; box-shadow: 0 10px 26px rgba(29, 36, 51, .30);
    transition: transform .1s ease, filter .12s ease;
  }
  .diet-fab:hover { filter: brightness(1.05); }
  .diet-fab:active { transform: scale(.96); }
  .diet-fab:focus-visible { outline: 3px solid var(--dark); outline-offset: 2px; }

  .diet-overlay { position: fixed; inset: 0; background: rgba(15, 20, 30, .5); z-index: 60; }

  .diet-panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 70;
    width: 410px; max-width: 92vw;
    background: var(--bg);
    box-shadow: -14px 0 44px rgba(0, 0, 0, .32);
    display: flex; flex-direction: column;
    animation: dietIn .25s ease;
  }
  @keyframes dietIn { from { transform: translateX(24px); opacity: .3; } to { transform: none; opacity: 1; } }

  .diet-head {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 18px;
    background: linear-gradient(135deg, #1d2433, #2a3346);
    color: #fff; flex: none;
  }
  .diet-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--brand); color: var(--dark); display: grid; place-items: center; font-size: 22px; flex: none; }
  .diet-name { font-weight: 800; font-size: 16px; }
  .diet-status { font-size: 12px; opacity: .82; }
  .diet-close { margin-left: auto; background: rgba(255, 255, 255, .16); color: #fff; border: none; width: 34px; height: 34px; border-radius: 9px; font-size: 15px; cursor: pointer; }
  .diet-close:hover { background: rgba(255, 255, 255, .28); }

  .diet-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .diet-actions { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; background: var(--card); }

  .msg { max-width: 90%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.45; }
  .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 5px; color: var(--ink); }
  .msg.user { align-self: flex-end; background: var(--brand); color: var(--dark); font-weight: 600; border-bottom-right-radius: 5px; }
  .msg b { font-weight: 800; }

  .opt {
    background: var(--card); color: var(--ink);
    border: 1.5px solid color-mix(in srgb, var(--brand) 45%, var(--line));
    border-radius: 999px; padding: 9px 14px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .opt:hover { background: color-mix(in srgb, var(--brand) 14%, var(--card)); }
  .opt.sel { background: var(--brand); color: var(--dark); border-color: var(--brand); }
  .opt.cont { background: var(--dark); color: #fff; border-color: var(--dark); margin-left: auto; }
  .opt:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

  .rec { display: flex; flex-direction: column; gap: 4px; }
  .rec-item { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .rec-item .ri-emoji { font-size: 20px; }
  .rec-item .ri-name { flex: 1; font-weight: 700; font-size: 13.5px; }
  .rec-item .ri-kcal { font-size: 12px; font-weight: 800; color: var(--brand-600); }
  .rec-item .ri-macros { width: 100%; padding-left: 28px; font-size: 11.5px; color: var(--muted); }
  .rec-total { font-weight: 800; font-size: 13px; color: var(--ink); background: color-mix(in srgb, var(--brand) 15%, var(--card)); border: 1px solid color-mix(in srgb, var(--brand) 30%, var(--line)); border-radius: 10px; padding: 9px 11px; margin-top: 6px; }
  .rec-notes .rn-title { font-weight: 800; margin-bottom: 5px; }
  .rec-notes ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
  .rec-notes li { font-size: 13px; }

  @media (max-width: 480px) {
    .diet-panel { width: 100vw; max-width: 100vw; }
    .diet-fab span { display: none; }
    .diet-fab { padding: 15px; font-size: 22px; }
  }
</style>
