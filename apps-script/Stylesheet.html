<style>
  :root {
    --bg: #fbf7f0;
    --card: #ffffff;
    --ink: #2a2320;
    --muted: #8a7f76;
    --brand: #d9541e;      /* sıcak turuncu */
    --brand-dark: #b23f11;
    --accent: #f4a23b;
    --line: #ece3d8;
    --shadow: 0 8px 30px rgba(60, 40, 20, 0.10);
    --radius: 16px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app { max-width: 1040px; margin: 0 auto; padding: 0 16px 60px; }

  /* -------------------------- HERO / BAŞLIK -------------------------- */
  .hero {
    background: linear-gradient(135deg, var(--brand) 0%, var(--accent) 100%);
    color: #fff;
    border-radius: 0 0 28px 28px;
    padding: 34px 22px 30px;
    margin: 0 -16px 26px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .hero-inner { max-width: 720px; margin: 0 auto; }
  .badge {
    display: inline-block;
    background: rgba(255, 255, 255, 0.22);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .3px;
    margin-bottom: 12px;
    backdrop-filter: blur(4px);
  }
  .hero h1 {
    margin: 4px 0 6px;
    font-size: clamp(26px, 5vw, 40px);
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .hero .subtitle { margin: 0 0 20px; opacity: .92; font-size: 15px; }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .controls label { font-size: 14px; font-weight: 600; opacity: .95; }
  select#dateSelect {
    appearance: none;
    -webkit-appearance: none;
    background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23d9541e' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 12px center;
    color: var(--ink);
    border: none;
    border-radius: 12px;
    padding: 11px 38px 11px 14px;
    font-size: 15px;
    font-weight: 600;
    min-width: 240px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
  }
  button#todayBtn {
    background: rgba(255,255,255,.95);
    color: var(--brand-dark);
    border: none;
    border-radius: 12px;
    padding: 11px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
    transition: transform .08s ease;
  }
  button#todayBtn:active { transform: scale(.96); }

  input#search {
    width: 100%;
    max-width: 420px;
    border: none;
    border-radius: 12px;
    padding: 11px 16px;
    font-size: 15px;
    box-shadow: 0 4px 14px rgba(0,0,0,.10);
    outline: none;
  }

  /* -------------------------- ACCORDION / GÜN -------------------------- */
  .menu { display: flex; flex-direction: column; gap: 14px; }

  .day {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(60,40,20,.05);
    transition: box-shadow .2s ease;
  }
  .day.open { box-shadow: var(--shadow); border-color: #f0d3bf; }

  .day-head {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    background: none;
    border: none;
    text-align: left;
    padding: 18px 20px;
    cursor: pointer;
    font-family: inherit;
  }
  .day-head:hover { background: #fdf6ee; }
  .day-date {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 58px;
    background: linear-gradient(135deg, var(--brand), var(--accent));
    color: #fff;
    border-radius: 12px;
    padding: 8px 6px;
    line-height: 1.1;
  }
  .day-date .d { font-size: 22px; font-weight: 800; }
  .day-date .m { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; opacity: .95; }
  .day-title { flex: 1; }
  .day-title .wd { font-size: 17px; font-weight: 700; color: var(--ink); }
  .day-title .sub { font-size: 13px; color: var(--muted); }
  .day-head .chev {
    width: 26px; height: 26px; flex: none;
    color: var(--brand);
    transition: transform .25s ease;
  }
  .day.open .day-head .chev { transform: rotate(180deg); }
  .today-tag {
    background: var(--brand);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    margin-left: 8px;
  }

  .day-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height .35s ease;
  }
  .day.open .day-body { max-height: 4000px; }

  .dishes {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
    padding: 4px 20px 22px;
  }
  .dish {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .dish:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .dish .thumb {
    position: relative;
    aspect-ratio: 4 / 3;
    background: #f3ece2;
    overflow: hidden;
  }
  .dish .thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .dish .cat {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(0,0,0,.55);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
    backdrop-filter: blur(3px);
  }
  .dish .name {
    padding: 10px 12px 12px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }

  .empty-day { padding: 8px 20px 22px; color: var(--muted); font-size: 14px; }

  /* -------------------------- DURUM MESAJLARI -------------------------- */
  .loading, .error, .noresult {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 15px;
  }
  .error { color: var(--brand-dark); }
  .spinner {
    width: 34px; height: 34px;
    border: 4px solid var(--line);
    border-top-color: var(--brand);
    border-radius: 50%;
    margin: 0 auto 14px;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .foot {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 30px;
  }

  @media (max-width: 480px) {
    .day-head { padding: 14px 14px; gap: 10px; }
    .dishes { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); padding: 4px 14px 18px; }
    select#dateSelect { min-width: 180px; }
  }
</style>
