<title>Valeo · Temmuz Yemek Listesi — Önizleme</title>
<style>
  /* ===== VALEO: Yeşil #82E600 · Mirage #1D2433 · Beyaz ===== */
  :root {
    --bg:#f3f6f1; --card:#ffffff; --ink:#1d2433; --muted:#6c7482;
    --brand:#82e600; --brand-600:#5fae00; --dark:#1d2433; --dark-2:#2a3346;
    --line:#e4e9df; --shadow:0 10px 34px rgba(29,36,51,0.12); --radius:16px;
  }
  @media (prefers-color-scheme: dark){ :root{ --bg:#141a26; --card:#1f2735; --ink:#eef1f5; --muted:#9aa3b2; --line:#2c3546; --shadow:0 10px 34px rgba(0,0,0,0.5); } }
  :root[data-theme="dark"]{ --bg:#141a26; --card:#1f2735; --ink:#eef1f5; --muted:#9aa3b2; --line:#2c3546; --shadow:0 10px 34px rgba(0,0,0,0.5); }
  :root[data-theme="light"]{ --bg:#f3f6f1; --card:#ffffff; --ink:#1d2433; --muted:#6c7482; --line:#e4e9df; --shadow:0 10px 34px rgba(29,36,51,0.12); }

  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased; }
  .app { max-width:1040px; margin:0 auto; padding:0 16px 60px; }

  .hero { position:relative; background:linear-gradient(135deg,#1d2433 0%,#2a3346 55%,#1d2433 100%); color:#fff; border-radius:0 0 28px 28px; padding:34px 22px 30px; margin:0 -16px 26px; box-shadow:var(--shadow); text-align:center; overflow:hidden; }
  .hero::before { content:""; position:absolute; top:0; left:0; right:0; height:4px; background:var(--brand); }
  .hero-inner { max-width:720px; margin:0 auto; position:relative; }
  .badge { display:inline-block; background:var(--brand); color:var(--dark); padding:6px 14px; border-radius:999px; font-size:13px; font-weight:800; letter-spacing:.4px; margin-bottom:14px; }
  .hero h1 { margin:4px 0 6px; font-size:clamp(26px,5vw,40px); font-weight:800; letter-spacing:-.5px; text-wrap:balance; }
  .hero h1::after { content:""; display:block; width:64px; height:4px; background:var(--brand); border-radius:999px; margin:10px auto 0; }
  .hero .subtitle { margin:6px 0 20px; opacity:.85; font-size:15px; }
  .controls { display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .controls label { font-size:14px; font-weight:600; }
  select#dateSelect { appearance:none; -webkit-appearance:none;
    background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%231d2433' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 12px center;
    color:#1d2433; border:none; border-radius:12px; padding:11px 38px 11px 14px; font-size:15px; font-weight:600; min-width:240px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.18); }
  button#todayBtn { background:var(--brand); color:var(--dark); border:none; border-radius:12px; padding:11px 18px; font-size:15px; font-weight:800; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.2); }
  button#todayBtn:active { transform:scale(.96); }
  input#search { width:100%; max-width:420px; border:none; border-radius:12px; padding:11px 16px; font-size:15px; box-shadow:0 4px 14px rgba(0,0,0,.14); outline:none; color:#1d2433; }

  .menu { display:flex; flex-direction:column; gap:14px; }
  .search-head { font-size:14px; font-weight:700; color:var(--muted); padding:2px 4px; }
  .day { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
  .day-head { display:flex; align-items:center; gap:14px; padding:18px 20px; border-bottom:1px solid var(--line); }
  .day-date { display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:58px; background:linear-gradient(135deg,#82e600,#6cc400); color:var(--dark); border-radius:12px; padding:8px 6px; line-height:1.1; }
  .day-date .d { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; }
  .day-date .m { font-size:11px; text-transform:uppercase; letter-spacing:.5px; opacity:.85; }
  .day-title { flex:1; display:flex; flex-direction:column; }
  .day-title .wd { font-size:18px; font-weight:800; }
  .day-title .sub { font-size:13px; color:var(--muted); }
  .today-tag { background:var(--brand); color:var(--dark); font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; margin-left:8px; }
  .daynav { display:flex; gap:8px; flex:none; }
  .navbtn { width:40px; height:40px; border:1px solid var(--line); background:var(--card); color:var(--brand-600); border-radius:11px; font-size:22px; font-weight:800; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .navbtn:hover:not([disabled]) { background:var(--brand); color:var(--dark); border-color:var(--brand); }
  .navbtn:active:not([disabled]) { transform:scale(.94); }
  .navbtn[disabled] { opacity:.35; cursor:not-allowed; }

  .dishes { display:flex; flex-direction:column; gap:10px; padding:16px 18px 20px; }
  .dish { display:flex; align-items:center; gap:14px; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:14px; transition:transform .1s ease, box-shadow .1s ease, border-color .1s ease; }
  .dish:hover { transform:translateY(-1px); box-shadow:var(--shadow); border-color:color-mix(in srgb, var(--brand) 35%, var(--line)); }
  .dish .icon { width:52px; height:52px; flex:none; border-radius:13px; display:grid; place-items:center; font-size:27px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.28), 0 2px 6px rgba(29,36,51,.12); }
  .dish .info { flex:1; display:flex; flex-direction:column; min-width:0; }
  .dish .dname { font-size:15px; font-weight:700; color:var(--ink); }
  .dish .dcat { font-size:12px; color:var(--muted); }
  .dish .kcal { flex:none; display:inline-flex; align-items:baseline; gap:3px; font-size:15px; font-weight:800; color:var(--brand-600); background:color-mix(in srgb, var(--brand) 15%, var(--card)); border:1px solid color-mix(in srgb, var(--brand) 35%, var(--line)); padding:6px 12px; border-radius:999px; font-variant-numeric:tabular-nums; }
  .dish .kcal small { font-size:10px; font-weight:700; color:var(--muted); }
  .noresult { text-align:center; padding:40px 20px; color:var(--muted); }

  .foot { text-align:center; color:var(--muted); font-size:12px; margin-top:30px; }
  @media (max-width:480px){ .day-head{padding:14px;gap:10px;} .dishes{padding:14px;} .dish .icon{width:46px;height:46px;font-size:24px;} .dish .kcal{font-size:14px;padding:5px 10px;} select#dateSelect{min-width:180px;} }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;} }
</style>

<div class="app">
  <header class="hero">
    <div class="hero-inner">
      <span class="badge">Valeo</span>
      <h1>Temmuz Yemek Listesi</h1>
      <p class="subtitle">Bir tarih seçin; o günün menüsü ve kalori değerleri aşağıda açılsın.</p>
      <div class="controls">
        <label for="dateSelect">Tarih:</label>
        <select id="dateSelect"></select>
        <button id="todayBtn" type="button">Bugün</button>
      </div>
      <input id="search" type="search" placeholder="Yemek ara… (ör. çorba, kebap, salata)" autocomplete="off">
    </div>
  </header>
  <main id="menu" class="menu"></main>
  <footer class="foot">
    Kalori değerleri yemek tipine göre <strong>porsiyon başına yaklaşık</strong> tahminlerdir.<br>
    Örnek veri: 1–10 Temmuz 2026 · Gerçek veriler E-Tablo'dan çekilir.
  </footer>
</div>

<script>
  var RAW = {
    "2026-07-01": ["EZOGELİN ÇORBA","İSKENDER KEBAP","MEVSİM TÜRLÜ","ARPA ŞEHRİYELİ PİRİNÇ PİLAVI","ISPANAKLI BÖREK","ÇİKOLATALI SPOONFUL","YOĞURT","AYRAN","HUMUS","HAVUÇ SALATA","DOM.GÖBEK SALATA","BİBERİYE TURŞU"],
    "2026-07-02": ["YOĞURT ÇORBA","ETLİ NOHUT","EKŞİLİ BAMYA","SADE PİRİNÇ PİLAVI","SOSLU MAKARNA","SÜT HELVASI","CACIK","HERSE","SOĞAN SÖĞÜŞ","YEŞİL SALATA","KARIŞIK TURŞU"],
    "2026-07-03": ["DÜĞÜN ÇORBA","KARIŞIK MUSAKKA","YOĞURTLU SEMİZOTU","SEBZELİ BULGUR PİLAVI","PEYNİRLİ MAKARNA","AŞURE","YOĞURT","AYRAN","ÇİĞ KÖFTE","GÖBEK SALATA","SALATALIK TURŞU"],
    "2026-07-06": ["MERCİMEK ÇORBA","FIRIN KÖFTE","PİLİÇ BAGET","BULGUR PİLAVI","MANTI","DONDURMA","YOĞURT","AYRAN","ZEYTİNYAĞLI TAZE FASULYE","KARIŞIK YEŞİL SALATA","BAKLAVA"],
    "2026-07-07": ["DÜĞÜN ÇORBA","TAVUK SOTE","KURU FASULYE","PİRİNÇ PİLAVI","YOĞURT","MEVSİM SALATA"],
    "2026-07-08": ["TERBİYELİ ŞEHRİYE ÇORBA","MANTAR SOSLU BİFTEK","SÜTLAÇ","CACIK","YEŞİL SALATA","TURŞU"],
    "2026-07-09": ["TAVUKSUYU ÇORBA","KURU FASULYE","PİRİNÇ PİLAVI","AYRAN","ROKA SALATA","REVANİ"],
    "2026-07-10": ["SEBZE ÇORBA","KASAP KÖFTE","ARPA ŞEHRİYELİ PİLAV","BAKLAVA","YOĞURT","KISIR"]
  };
  var TODAY = '2026-07-06';

  var MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  var MONTHS_SHORT = ['OCA','ŞUB','MAR','NİS','MAY','HAZ','TEM','AĞU','EYL','EKİ','KAS','ARA'];
  var WD = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];

  function trLower(s){ return String(s==null?'':s).replace(/İ/g,'i').replace(/I/g,'ı').toLowerCase(); }
  function trUpperFirst(c){ return c==='i'?'İ':(c==='ı'?'I':c.toUpperCase()); }
  function toTitleTr(s){ return trLower(s).split(/(\s+)/).map(function(w){ return w.trim()?trUpperFirst(w.charAt(0))+w.slice(1):w; }).join(''); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function categorize(name){
    var n = trLower(name);
    var rules = [
      { any:['çorba'], tag:'soup', emoji:'🍲', label:'Çorba' },
      { any:['ayran','cacık','kefir'], tag:'ayran', emoji:'🥛', label:'İçecek' },
      { any:['yoğurt'], tag:'yogurt', emoji:'🥣', label:'Yoğurt' },
      { any:['turşu'], tag:'pickles', emoji:'🥒', label:'Turşu' },
      { any:['salata','söğüş','kısır'], tag:'salad', emoji:'🥗', label:'Salata' },
      { any:['humus','haydari','ezme','meze'], tag:'hummus', emoji:'🫓', label:'Meze' },
      { any:['börek','poğaça','pide','gözleme'], tag:'pastry', emoji:'🥟', label:'Hamur İşi' },
      { any:['pilav','bulgur','şehriye'], tag:'rice', emoji:'🍚', label:'Pilav' },
      { any:['makarna','erişte','mantı'], tag:'pasta', emoji:'🍝', label:'Makarna' },
      { any:['helva','aşure','sütlaç','baklava','tatlı','spoonful','revani','kadayıf','muhallebi','dondurma','sultan'], tag:'dessert', emoji:'🍮', label:'Tatlı' },
      { any:['kebap','köfte','iskender','döner','biftek','tavuk','piliç','baget','etli','musakka','sote','kavurma'], tag:'kebab', emoji:'🍢', label:'Ana Yemek (Et)' },
      { any:['nohut','fasulye','bamya','türlü','sebze','semizotu','ıspanak','dolma','sarma','mücver','pırasa','kabak','herse','bezelye'], tag:'vegetable', emoji:'🥘', label:'Sebze Yemeği' },
      { any:['ekmek'], tag:'bread', emoji:'🍞', label:'Ekmek' }
    ];
    for (var i=0;i<rules.length;i++) for (var j=0;j<rules[i].any.length;j++) if (n.indexOf(rules[i].any[j])!==-1) return rules[i];
    return { tag:'turkish-food', emoji:'🍽️', label:'Yemek' };
  }
  function gradientFor(tag){
    var m={soup:['#e0a35a','#c9711f'],kebab:['#c9502a','#a13417'],rice:['#e6c887','#cba954'],pasta:['#e8b96a','#cf9a3d'],pastry:['#e0a458','#c47e2b'],dessert:['#d98cae','#bd5f88'],salad:['#7cbf59','#4f9b3a'],pickles:['#8fb84f','#6a9433'],vegetable:['#8aa84a','#5f8034'],ayran:['#79b6d6','#4f8fb8'],yogurt:['#cfd6dd','#a7b0ba'],hummus:['#d9b56b','#bd923f'],bread:['#d7b483','#b98f52']};
    return m[tag]||['#c99a5a','#a9793a'];
  }

  var CATEGORY_KCAL = { soup:120, kebab:360, rice:270, pasta:320, pastry:300, dessert:340, salad:70, pickles:20, vegetable:170, ayran:70, yogurt:90, hummus:170, bread:90, 'turkish-food':220 };
  var KCAL_KEYWORDS = [
    ['mercimek çorba',150],['ezogelin',140],['düğün çorba',160],['yoğurt çorba',150],['yayla',150],['tavuksuyu',90],['tavuk suyu',90],['terbiyeli',140],['domates çorba',130],['şehriye çorba',130],['sebze çorba',100],['soğuk çorba',90],['çorba',120],
    ['baklava',380],['künefe',450],['kadayıf',380],['tulumba',360],['sütlaç',220],['muhallebi',200],['kazandibi',260],['aşure',250],['dondurma',200],['revani',340],['irmik helva',360],['helva',360],['profiterol',380],['trileçe',330],['kemalpaşa',340],['spoonful',300],['çikolatalı',320],['tatlı',320],
    ['iskender',650],['döner',520],['lahmacun',300],['pizza',450],['adana',480],['urfa',470],['şiş',380],['fırın köfte',340],['izgara köfte',320],['çiğ köfte',180],['köfte',320],['musakka',300],['karnıyarık',300],['saç kavurma',380],['kavurma',400],['güveç',280],['schnitzel',400],['şnitzel',400],['biftek',350],['bonfile',380],['tavuk sote',300],['tavuk',300],['piliç',300],['baget',320],['kanat',350],
    ['etli nohut',260],['kuru fasulye',280],['barbunya',250],['taze fasulye',130],['nohut',240],['bamya',120],['türlü',160],['semizotu',110],['ıspanak',120],['pırasa',120],['kabak',120],['bezelye',150],['dolma',220],['sarma',200],['mücver',240],['imambayıldı',220],['zeytinyağlı',150],['etli',300],
    ['mantı',350],['makarna',320],['erişte',300],['lazanya',380],['su böreği',320],['börek',320],['poğaça',260],['gözleme',300],['pide',350],['bulgur',250],['pilav',270],
    ['ayran',60],['cacık',90],['kefir',70],['şıra',120],['yoğurt',90],['humus',180],['haydari',150],['ezme',90],['söğüş',30],['salata',60],['turşu',20],['herse',250],['keşkek',260],['kısır',180]
  ];
  function calorieFor(name, tag){
    var n=trLower(name);
    for(var i=0;i<KCAL_KEYWORDS.length;i++){ if(n.indexOf(KCAL_KEYWORDS[i][0])!==-1) return KCAL_KEYWORDS[i][1]; }
    return CATEGORY_KCAL[tag]||200;
  }

  var DAYS = Object.keys(RAW).sort().map(function(iso){
    var p=iso.split('-').map(Number), dt=new Date(p[0],p[1]-1,p[2]);
    return { iso:iso, day:p[2], month:p[1], weekday:WD[dt.getDay()],
      dishes: RAW[iso].map(function(name){ var c=categorize(name); return {name:name, pretty:toTitleTr(name), emoji:c.emoji, category:c.label, tag:c.tag, kcal:calorieFor(name,c.tag)}; }) };
  });
  var IDX={}; DAYS.forEach(function(d,i){ IDX[d.iso]=i; });
  var CUR=null;

  document.getElementById('dateSelect').innerHTML = DAYS.map(function(d){ return '<option value="'+d.iso+'">'+d.day+' '+MONTHS[d.month-1]+' · '+d.weekday+'</option>'; }).join('');
  document.getElementById('dateSelect').addEventListener('change', function(){ if(this.value) showDay(this.value,true); });
  document.getElementById('todayBtn').addEventListener('click', function(){ showDay(pickDefault(),true); });
  document.getElementById('search').addEventListener('input', function(){ applySearch(this.value); });

  function pickDefault(){ for(var i=0;i<DAYS.length;i++) if(DAYS[i].iso===TODAY) return DAYS[i].iso; for(var j=0;j<DAYS.length;j++) if(DAYS[j].iso>=TODAY) return DAYS[j].iso; return DAYS[0].iso; }

  function dishHtml(dish){
    var g=gradientFor(dish.tag);
    return '<div class="dish">'+
      '<span class="icon" style="background:linear-gradient(135deg,'+g[0]+','+g[1]+')">'+dish.emoji+'</span>'+
      '<div class="info"><span class="dname">'+esc(dish.pretty)+'</span><span class="dcat">'+esc(dish.category)+'</span></div>'+
      '<span class="kcal" title="Yaklaşık kalori (porsiyon başına)">≈ '+dish.kcal+'<small>kcal</small></span>'+
    '</div>';
  }

  function showDay(iso, scroll){
    if(IDX[iso]===undefined) return; CUR=iso;
    var i=IDX[iso], d=DAYS[i];
    var sel=document.getElementById('dateSelect'); if(sel.value!==iso) sel.value=iso;
    var hasPrev=i>0, hasNext=i<DAYS.length-1, isToday=iso===TODAY;
    document.getElementById('menu').innerHTML='<section class="day">'+
      '<div class="day-head">'+
        '<span class="day-date"><span class="d">'+d.day+'</span><span class="m">'+MONTHS_SHORT[d.month-1]+'</span></span>'+
        '<div class="day-title"><span class="wd">'+esc(d.weekday)+(isToday?'<span class="today-tag">BUGÜN</span>':'')+'</span><span class="sub">'+d.day+' '+MONTHS[d.month-1]+' · '+d.dishes.length+' çeşit yemek</span></div>'+
        '<div class="daynav"><button class="navbtn" id="prevDay" '+(hasPrev?'':'disabled')+'>‹</button><button class="navbtn" id="nextDay" '+(hasNext?'':'disabled')+'>›</button></div>'+
      '</div>'+
      '<div class="dishes">'+d.dishes.map(dishHtml).join('')+'</div></section>';
    if(hasPrev) document.getElementById('prevDay').addEventListener('click',function(){ showDay(DAYS[i-1].iso,true); });
    if(hasNext) document.getElementById('nextDay').addEventListener('click',function(){ showDay(DAYS[i+1].iso,true); });
    if(scroll) window.scrollTo({top:0,behavior:'smooth'});
  }

  function applySearch(q){
    q=trLower((q||'').trim());
    if(!q){ showDay(CUR||pickDefault(),false); return; }
    var blocks=[];
    DAYS.forEach(function(d){
      var m=d.dishes.filter(function(dish){ return trLower(dish.pretty).indexOf(q)!==-1; });
      if(!m.length) return;
      blocks.push('<section class="day"><div class="day-head"><span class="day-date"><span class="d">'+d.day+'</span><span class="m">'+MONTHS_SHORT[d.month-1]+'</span></span><div class="day-title"><span class="wd">'+esc(d.weekday)+'</span><span class="sub">'+d.day+' '+MONTHS[d.month-1]+'</span></div></div><div class="dishes">'+m.map(dishHtml).join('')+'</div></section>');
    });
    document.getElementById('menu').innerHTML=blocks.length?('<div class="search-head">“'+esc(q)+'” için '+blocks.length+' gün bulundu</div>'+blocks.join('')):('<div class="noresult">“'+esc(q)+'” için sonuç bulunamadı.</div>');
  }

  showDay(pickDefault(), false);
</script>
